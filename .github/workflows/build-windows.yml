name: Build Windows (云端极速打包)

on:
  workflow_dispatch:
    inputs:
      bundle_target:
        description: "打包格式 (nsis = 推荐安装版 .exe; all = .exe + .msi; portable = 仅免安装绿色版)"
        required: false
        default: "nsis"
        type: choice
        options:
          - nsis
          - all
          - portable
      build_headless_server:
        description: "是否额外编译纯后端无界面服务 (antigravity-server.exe)"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Tauri build configuration
        id: prep
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BUNDLE_TARGET: ${{ inputs.bundle_target || 'nsis' }}
        run: |
          $ErrorActionPreference = "Stop"

          # 1. 读取当前项目版本号
          $pkg = Get-Content -Raw "package.json" | ConvertFrom-Json
          $ver = $pkg.version
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Detected project version: $ver"

          # 2. 若未配置更新器签名私钥，自动关闭 createUpdaterArtifacts 防止未签名构建报错
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            $configPath = "src-tauri/tauri.conf.json"
            $config = Get-Content -Raw $configPath | ConvertFrom-Json
            $config.bundle.createUpdaterArtifacts = $false
            $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY configured; disabled updater artifacts."
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY detected; keeping updater artifacts enabled."
          }

          # 3. 解析打包目标参数（WiX MSI 不支持含 '-' 的预发布 SemVer 版本号，自动安全降级为 NSIS）
          $target = $env:BUNDLE_TARGET
          $tauriArgs = ""
          if ($target -eq "portable") {
            $tauriArgs = "--no-bundle"
          } elseif ($target -eq "nsis") {
            $tauriArgs = "--bundles nsis"
          } elseif ($target -eq "all") {
            if ($ver -match "-") {
              Write-Host "Prerelease version ($ver) detected; WiX MSI does not support SemVer prerelease suffixes. Falling back to NSIS."
              $tauriArgs = "--bundles nsis"
            } else {
              # 空参数默认沿用 tauri.conf.json 的 "targets": "all"（产出 NSIS .exe + WiX .msi）
              $tauriArgs = ""
            }
          }
          "tauri_args=$tauriArgs" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved Tauri build args: '$tauriArgs'"

      - name: Build Windows Desktop App
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_ARGS: ${{ steps.prep.outputs.tauri_args }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TAURI_ARGS)) {
            npm run tauri build
          } else {
            $argList = $env:TAURI_ARGS -split '\s+'
            npm run tauri build -- @argList
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Headless Server (Optional)
        if: ${{ inputs.build_headless_server == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --bin antigravity-server --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows Packages & Generate Checksums
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.prep.outputs.version }}
          BUILD_HEADLESS: ${{ inputs.build_headless_server }}
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "artifacts-windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 1. 收集 NSIS (.exe) 与 MSI (.msi) 安装包
          $installers = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.exe", "*.msi" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -match 'bundle[\\/](nsis|msi)$' }
          foreach ($file in $installers) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $outDir $file.Name) -Force
          }

          # 2. 封装免安装绿色便携版 (.zip = antigravity-tools.exe + WebView2Loader.dll)
          $mainExe = "src-tauri/target/release/antigravity-tools.exe"
          if (Test-Path $mainExe) {
            $portableStage = "portable-stage/Antigravity Tools"
            New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
            Copy-Item -Path $mainExe -Destination $portableStage -Force
            if (Test-Path "src-tauri/resources/WebView2Loader.dll") {
              Copy-Item -Path "src-tauri/resources/WebView2Loader.dll" -Destination $portableStage -Force
            }
            $portableZip = Join-Path $outDir "Antigravity.Tools_$($env:APP_VERSION)_x64-portable.zip"
            Compress-Archive -Path "$portableStage/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force "portable-stage"
          }

          # 3. 封装可选的无界面纯后端版 (.zip = antigravity-server.exe + dist/)
          $serverExe = "src-tauri/target/release/antigravity-server.exe"
          if ($env:BUILD_HEADLESS -eq "true" -and (Test-Path $serverExe)) {
            $serverStage = "server-stage/antigravity-server"
            New-Item -ItemType Directory -Force -Path $serverStage | Out-Null
            Copy-Item -Path $serverExe -Destination $serverStage -Force
            if (Test-Path "dist") {
              Copy-Item -Path "dist" -Destination (Join-Path $serverStage "dist") -Recurse -Force
            }
            $serverZip = Join-Path $outDir "Antigravity.Server_$($env:APP_VERSION)_x64-headless.zip"
            Compress-Archive -Path "$serverStage/*" -DestinationPath $serverZip -Force
            Remove-Item -Recurse -Force "server-stage"
          }

          # 4. 生成构建摘要与 SHA256 校验表
          $files = Get-ChildItem -Path $outDir -File
          if ($files.Count -eq 0) {
            Write-Error "No build artifacts were generated in $outDir!"
            exit 1
          }

          $summary = @(
            "### 🪟 Windows 云端打包产物 (v$($env:APP_VERSION))",
            "",
            "| 文件名 | 大小 (MB) | SHA-256 |",
            "| :--- | ---: | :--- |"
          )
          foreach ($f in $files) {
            $sizeMb = [math]::Round($f.Length / 1MB, 2)
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            $summary += "| ``$($f.Name)`` | $sizeMb MB | ``$hash`` |"
            Write-Host "Staged: $($f.Name) ($sizeMb MB) - SHA256: $hash"
          }
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Tools-Windows-v${{ steps.prep.outputs.version }}-run${{ github.run_number }}
          path: artifacts-windows/*
          if-no-files-found: error
          retention-days: 30
